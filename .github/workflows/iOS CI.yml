# CoinPulse Github Actions iOS CI
name: iOS CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build:

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build CoinPulse
        run: |
          xcodebuild \
            -project CoinPulse.xcodeproj \
            -scheme CoinPulse \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build

      - name: Run CoinPulse Tests
        run: |
          xcodebuild \
            -project CoinPulse.xcodeproj \
            -scheme CoinPulse \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test
